<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>countdownTimer</title>
</head>

<body>

    <header>
    </header>

    <main>
        <div class="container">
            <div class="content">
                <h1>D-day</h1>


                <div class="container-time">

                    <div class="time-item">
                        <h1 id="days">00</h1>
                        <p>Days</p>
                    </div>
                    <div class="time-item">
                        <h1 id="hours">00</h1>
                        <p>hours</p>
                    </div>

                    <div class="time-item">
                        <h1 id="minutes">00</h1>
                        <p>minutes</p>
                    </div>

                    <div class="time-item">
                        <h1 id="seconds">00</h1>
                        <p>second</p>
                    </div>


                </div>

            </div>
        </div>
    </main>

    <footer>
    </footer>

</body>
<script src="script.js"></script>

</html>
