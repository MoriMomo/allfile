<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starter</title>
  <!-- font-awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css" />

  <!-- styles -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main>
    <section class="container">

      <!-- judul -->
      <div class="title">
        <h2>our reviews</h2>
        <div class="underline"></div>
      </div>

      <!-- REVIEW -->
      <div class="review">

        <div class="img-container">
          <img src="./person-1.jpeg" alt="" id="person-img">
        </div>
        <h3 id="author">lorem ipsum</h3>
        <p id="job">ux designer</p>
        <p id="info">
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Hic quis nostrum, tenetur nobis possimus soluta, aut
          provident aperiam minus quod facilis! Quam error veniam quisquam corrupti dignissimos corporis numquam
          inventore?
        </p>

        <!-- buttons next and prev -->
        <div class="button-container">
          <button class="prev-btn">
            <i class="fas fa-chevron-circle-left"></i>
          </button>
          <button class="next-btn">
            <i class="fas fa-chevron-circle-right"></i>
          </button>
        </div>

        <!-- button random -->
        <button class="random-btn">Click me</button>

      </div>
    </section>
  </main>





  <!-- javascript -->
  <script src="app.js"></script>
</body>

</html>
