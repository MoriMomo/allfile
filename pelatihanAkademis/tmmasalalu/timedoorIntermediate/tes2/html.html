<script>
    class Students {
        constructor(ID, name, grade) {
            this.ID = ID;
            this.name = name;
            this.grade = grade;
            this.display = function () {
                document.write(this.ID + " " + this.name + " " + this.grade + " <br> ")
            }

        }

    }
    var student1 = new Students("1", "Hanna", "7A")

</script>
